# The offline tests on every push to master and every pull request.
name: tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
