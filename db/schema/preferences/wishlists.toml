# Default wishlist sources: the DIM wishlists the app ships with, one table
# each, named by its key. open_db adds each source the wishlist_preference
# table lacks and never changes a saved one; add your own with --add-wishlist.
#   label = the name the report shows
#   url   = a raw DIM wishlist .txt file

[voltron]
label = "Voltron (Pandapaxxy/Mercules +trash)"
url = "https://raw.githubusercontent.com/48klocs/dim-wish-list-sources/master/choosy_voltron.txt"

[aegis_endgame]
label = "Aegis Endgame"
url = "https://raw.githubusercontent.com/Ciceron14/dim-extra-wishlists/main/Aegis%20Spreadsheets%20Wishlists/Aegis%20Endgame%20Analysis/dim_aegis_endgame.txt"

[aegis_shopping]
label = "Aegis Shopping List"
url = "https://raw.githubusercontent.com/Ciceron14/dim-extra-wishlists/main/Aegis%20Spreadsheets%20Wishlists/Aegis%20Endgame%20Analysis/Shopping%20List/dim_aegis_endgame-shopping_list.txt"
